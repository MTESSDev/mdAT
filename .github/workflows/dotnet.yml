# This workflow will build and test the .NET projects, and pack the NuGet packages
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

permissions:
  contents: read
  pull-requests: write


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
 run:
  working-directory: ./src

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version:  |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore

    # The test project is a TUnit executable (Microsoft Testing Platform): it is run, one target framework at a time
    - name: Test (net8.0)
      run: dotnet run --project MDAT.Tests --no-build -f net8.0
    - name: Test (net9.0)
      run: dotnet run --project MDAT.Tests --no-build -f net9.0
    - name: Test (net10.0)
      if: runner.os != 'Linux'
      run: dotnet run --project MDAT.Tests --no-build -f net10.0
    - name: Test (net10.0, with code coverage)
      if: runner.os == 'Linux'
      run: dotnet run --project MDAT.Tests --no-build -f net10.0 -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

    - name: Code Coverage Report
      if: runner.os == 'Linux'
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: src/MDAT.Tests/bin/Debug/net10.0/TestResults/coverage.cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        # line rate / branch rate (measured: ~85% / ~75%)
        thresholds: '80 70'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: runner.os == 'Linux' && github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    # Packages for review only: nothing is published from here
    - name: Pack
      if: runner.os == 'Linux'
      run: dotnet pack MDAT.slnx -c Release -o ../artifacts
    - name: Upload packages
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/*
        if-no-files-found: error
