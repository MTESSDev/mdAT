# This workflow will build and test the .NET projects, and pack the NuGet packages
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
#
# The tests run on Microsoft Testing Platform (MTP): `dotnet test` is switched to MTP mode by the "test" section of
# global.json (the .NET 10 SDK is needed), and the reports (TRX, code coverage) are produced by MTP extensions.

name: .NET

permissions:
  contents: read
  pull-requests: write


on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
 run:
  working-directory: ./src

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version:  |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore

    # One target framework at a time. Every run keeps going when the one before it failed, so that all the failures show up,
    # and the job still fails at the end. The reports go to TestResults/<framework> (at the root of the repository).
    - name: Test (net8.0)
      run: dotnet test --solution MDAT.slnx --no-build --framework net8.0 --results-directory ../TestResults/net8.0 --report-trx
    - name: Test (net9.0)
      if: ${{ !cancelled() }}
      run: dotnet test --solution MDAT.slnx --no-build --framework net9.0 --results-directory ../TestResults/net9.0 --report-trx
    - name: Test (net10.0)
      if: ${{ !cancelled() && runner.os != 'Linux' }}
      run: dotnet test --solution MDAT.slnx --no-build --framework net10.0 --results-directory ../TestResults/net10.0 --report-trx
    - name: Test (net10.0, with code coverage)
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      run: dotnet test --solution MDAT.slnx --no-build --framework net10.0 --results-directory ../TestResults/net10.0 --report-trx --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

    # The TRX reports of the Microsoft Testing Platform and the coverage, kept even when a test fails
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: TestResults/**
        if-no-files-found: error

    - name: Code Coverage Report
      if: runner.os == 'Linux'
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: TestResults/net10.0/coverage.cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        # line rate / branch rate (measured: ~85% / ~75%)
        thresholds: '80 70'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: runner.os == 'Linux' && github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    # Packages for review only: nothing is published from here
    - name: Pack
      if: runner.os == 'Linux'
      run: dotnet pack MDAT.slnx -c Release -o ../artifacts
    - name: Upload packages
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/*
        if-no-files-found: error

  # The files to download: the NuGet packages and the Visual Studio extension. Nothing goes to nuget.org from here.
  # Every run keeps them as the "dist" artifact; a tag "v..." also attaches them to a GitHub release.
  dist:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version:  |
          8.0.x
          9.0.x
          10.0.x
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Pack the NuGet packages
      run: dotnet pack src/MDAT.slnx -c Release -o dist
    # The extension is built for .NET Framework: MSBuild of Visual Studio, not `dotnet build`
    - name: Build the Visual Studio extension
      run: msbuild src/MDAT.VisualStudio/MDAT.VisualStudio.csproj -restore -p:Configuration=Release -v:minimal
    - name: Copy the extension
      run: Copy-Item src/MDAT.VisualStudio/bin/Release/net472/MDAT.VisualStudio.vsix dist/
    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
    - name: Attach to the GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
